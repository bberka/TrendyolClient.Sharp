name: CI

# Runs on every pull request. Make the "Build & test" check required in the branch protection rules
# so nothing merges unless it passes.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8, 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Validate VERSION file
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'$version' is not a valid semantic version (expected e.g. 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          echo "Package version: $version"

      - name: Restore
        run: dotnet restore

      - name: Build (all target frameworks)
        run: dotnet build --configuration Release --no-restore

      - name: Test (net8.0, net9.0, net10.0)
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      - name: Pack (verifies the package builds)
        run: dotnet pack ./src/TrendyolClient.Sharp/TrendyolClient.Sharp.csproj --configuration Release --no-build --output ./nuget_packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
