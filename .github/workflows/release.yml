name: Release

# Manual stable release. Run it from the Actions tab on master after bumping the VERSION file in a merged PR.
# It publishes exactly the version in VERSION to NuGet and creates the matching v<version> tag and GitHub release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack only. Do not publish or tag."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases can only be made from master (this run is on ${{ github.ref }})."
          exit 1

      - name: Read and validate VERSION
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'$version' is not a valid semantic version"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Bump the VERSION file before releasing again."
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          # Last stable tag (no pre-release suffix) so the release notes cover everything since then
          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (tag $tag, prerelease=$prerelease, previous stable=${previous:-none})"

      - name: Setup .NET 8, 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack ./src/TrendyolClient.Sharp/TrendyolClient.Sharp.csproj --configuration Release --output ./nuget_packages -p:Version=${{ steps.version.outputs.version }}

      - name: Publish to NuGet
        if: ${{ !inputs.dry_run }}
        # No --skip-duplicate: publishing a version that already exists must fail loudly.
        run: dotnet nuget push "./nuget_packages/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Create tag and GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--target "${{ github.sha }}" --title "v${{ steps.version.outputs.version }}" --generate-notes)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then args+=(--prerelease); else args+=(--latest); fi
          if [ -n "${{ steps.version.outputs.previous }}" ]; then args+=(--notes-start-tag "${{ steps.version.outputs.previous }}"); fi
          gh release create "${{ steps.version.outputs.tag }}" "${args[@]}" ./nuget_packages/*.nupkg

      - name: Upload package (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nuget_packages
          retention-days: 3
